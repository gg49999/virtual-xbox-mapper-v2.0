name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        # vgamepad is skipped here: its setup.py launches the interactive
        # ViGEmBus installer. The tests don't need a real virtual pad.
        run: python -m pip install "PyQt6>=6.5" "pynput>=1.7.6" pytest pyflakes
      - name: Lint
        run: python -m pyflakes src tests tools
      - name: Test
        run: python -m pytest -q tests

  build:
    name: Windows build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ViGEmBus (so installing vgamepad doesn't prompt)
        run: choco install vigembus -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean installer/VirtualXboxMapper.spec --distpath build/dist --workpath build/work
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path src/app_info.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualXboxMapper-installer
          path: build/installer_output/*.exe
